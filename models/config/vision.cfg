aipp_op {
    aipp_mode: static
    input_format :  RGB888_U8
    src_image_size_w : 1008  # 输入图像的实际宽度 1008
    src_image_size_h : 1008  # 输入图像的实际高度 1008

    # 1. 核心修改：输入已经是 BGR/RGB 家族，无需色彩空间转换（CSC）
    csc_switch : false
    
    # 2. 核心修改：在 NPU 硬件内直接将 BGR 交换为 RGB 输送给模型
    rbuv_swap_switch : true

    # 关闭 Crop
    crop: false 

    # 3. 归一化配置：x_new = (x - mean - min) * var_reci
    # 对齐 TRT 的 pixel / 127.5 - 1，即 (pixel - 127.5) / 127.5。
    # mean_chn 是 uint8；用 mean=127 + float16 min=0.5 表达 127.5。
    # 修改后必须重新转换 Vision OM；运行时修改本 cfg 不会改变已有 OM。
    min_chn_0 : 0.5
    min_chn_1 : 0.5
    min_chn_2 : 0.5
    mean_chn_0: 127
    mean_chn_1: 127
    mean_chn_2: 127
    var_reci_chn_0: 0.00784313725490196
    var_reci_chn_1: 0.00784313725490196
    var_reci_chn_2: 0.00784313725490196
}
