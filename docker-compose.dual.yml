version: "2.3"

# Atlas 300I Duo 多进程部署：sam3-npu2、sam3-npu3 分别绑定一颗逻辑
# NPU，每颗 NPU 始终只对应一个容器，容器内通过 Uvicorn workers 启动多个
# 独立 SAM3 进程。Ascend UDA 不允许不同容器 namespace 同时打开同一 Device，
# 因此不要把这两个服务扩展为多个容器。三个服务均使用 host 网络，避免旧版
# openEuler Docker 重启后丢失自定义 bridge 网络而无法恢复容器。两个后端只监听
# 宿主机回环地址，Nginx 对外提供唯一入口。
# 不要设置 ASCEND_RT_VISIBLE_DEVICES；容器内统一使用逻辑 device 0。
services:
  sam3-npu2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CANN_IMAGE: ${CANN_IMAGE:-swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-310p-ubuntu22.04-py3.11}
        TOKENIZERS_GIT_REPOSITORY: ${TOKENIZERS_GIT_REPOSITORY:-https://github.com/mlc-ai/tokenizers-cpp.git}
        ABSEIL_GIT_REPOSITORY: ${ABSEIL_GIT_REPOSITORY:-https://github.com/abseil/abseil-cpp.git}
    image: ascend-sam3-service:latest
    command:
      - /bin/bash
      - -c
      - |
        exec python3 -m uvicorn service.main:app \
          --host 127.0.0.1 \
          --port "${SAM3_BACKEND_A_PORT:-18001}" \
          --workers "${SAM3_DEVICE_A_INSTANCES:-1}" \
          --timeout-worker-healthcheck "${SAM3_WORKER_HEALTHCHECK_TIMEOUT:-180}"
    network_mode: host
    ipc: host
    volumes:
      - ./models:/app/models:ro
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/Ascend/develop:/usr/local/Ascend/develop:ro
      - /etc/ascend_install.info:/etc/ascend_install.info:ro
    environment:
      ASCEND_DEVICE_ID: "0"
      SAM3_WORKERS: "${SAM3_DEVICE_A_INSTANCES:-1}"
      SAM3_LISTEN_PORT: "${SAM3_BACKEND_A_PORT:-18001}"
      SAM3_REFINE_MAX_CROPS: "${SAM3_REFINE_MAX_CROPS:-4}"
      SAM3_REFINE_MAX_PRE_DETECTIONS: "${SAM3_REFINE_MAX_PRE_DETECTIONS:-64}"
      VISION_MODEL: models/om-models/vision-encoder.om
      TEXT_MODEL: models/om-models/text-encoder.om
      DECODER_MODEL: models/om-models/decoder_static.om
      FPN_POS2: models/om-models/fpn_pos_2_constant.npy
      TOKENIZER: models/onnx-models/tokenizer.json
    devices:
      - /dev/davinci${SAM3_DEVICE_A:-2}:/dev/davinci${SAM3_DEVICE_A:-2}
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/devmm_svm:/dev/devmm_svm
      - /dev/hisi_hdc:/dev/hisi_hdc
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${SAM3_BACKEND_A_PORT:-18001}/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  sam3-npu3:
    # 与 sam3-npu2 共用已经构建好的镜像，避免重复执行镜像构建。
    image: ascend-sam3-service:latest
    command:
      - /bin/bash
      - -c
      - |
        exec python3 -m uvicorn service.main:app \
          --host 127.0.0.1 \
          --port "${SAM3_BACKEND_B_PORT:-18002}" \
          --workers "${SAM3_DEVICE_B_INSTANCES:-1}" \
          --timeout-worker-healthcheck "${SAM3_WORKER_HEALTHCHECK_TIMEOUT:-180}"
    network_mode: host
    ipc: host
    volumes:
      - ./models:/app/models:ro
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/Ascend/develop:/usr/local/Ascend/develop:ro
      - /etc/ascend_install.info:/etc/ascend_install.info:ro
    environment:
      ASCEND_DEVICE_ID: "0"
      SAM3_WORKERS: "${SAM3_DEVICE_B_INSTANCES:-1}"
      SAM3_LISTEN_PORT: "${SAM3_BACKEND_B_PORT:-18002}"
      SAM3_REFINE_MAX_CROPS: "${SAM3_REFINE_MAX_CROPS:-4}"
      SAM3_REFINE_MAX_PRE_DETECTIONS: "${SAM3_REFINE_MAX_PRE_DETECTIONS:-64}"
      VISION_MODEL: models/om-models/vision-encoder.om
      TEXT_MODEL: models/om-models/text-encoder.om
      DECODER_MODEL: models/om-models/decoder_static.om
      FPN_POS2: models/om-models/fpn_pos_2_constant.npy
      TOKENIZER: models/onnx-models/tokenizer.json
    devices:
      - /dev/davinci${SAM3_DEVICE_B:-3}:/dev/davinci${SAM3_DEVICE_B:-3}
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/devmm_svm:/dev/devmm_svm
      - /dev/hisi_hdc:/dev/hisi_hdc
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${SAM3_BACKEND_B_PORT:-18002}/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  sam3-gateway:
    # 1.30.4-alpine 是支持 arm64v8 的 Nginx 官方稳定镜像。
    image: ${SAM3_GATEWAY_IMAGE:-nginx:1.30.4-alpine}
    container_name: sam3-gateway
    network_mode: host
    environment:
      SAM3_PUBLIC_PORT: "${SAM3_PUBLIC_PORT:-18000}"
      SAM3_BACKEND_A_PORT: "${SAM3_BACKEND_A_PORT:-18001}"
      SAM3_BACKEND_B_PORT: "${SAM3_BACKEND_B_PORT:-18002}"
      NGINX_ENVSUBST_FILTER: "^SAM3_"
    volumes:
      - ./deploy/nginx/sam3-host.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - sam3-npu2
      - sam3-npu3
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${SAM3_PUBLIC_PORT:-18000}/gateway-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
