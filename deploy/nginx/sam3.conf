# Docker 内置 DNS。resolve + zone 允许后端容器重建、更换 IP 后自动恢复，
# 无需手工重启网关。resolve 在开源 Nginx 1.27.3 及以上版本可用。
resolver 127.0.0.11 valid=10s ipv6=off;

log_format sam3 '$remote_addr - $request_id [$time_local] "$request" '
                 'status=$status request_time=$request_time '
                 'upstream=$upstream_addr upstream_status=$upstream_status '
                 'upstream_time=$upstream_response_time';

upstream sam3_backend {
    zone sam3_backend 64k;
    least_conn;

    server sam3-npu2:8000 resolve max_fails=2 fail_timeout=10s;
    server sam3-npu3:8000 resolve max_fails=2 fail_timeout=10s;

    keepalive 16;
}

server {
    listen 8000;
    server_name _;

    access_log /var/log/nginx/access.log sam3;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 50m;
    client_body_timeout 30s;
    send_timeout 120s;

    # 只检查网关进程本身。对外的 /health 仍转发到后端：只要至少一个
    # SAM3 实例可用，失败重试即可获得成功响应。
    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://sam3_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 保留请求体缓冲，后端连接失败时才可将 POST 检测请求安全重试到
        # 另一个实例。检测接口无写入副作用，最多尝试两个后端。
        proxy_request_buffering on;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;

        # 仅用于运维排查；业务调用方无需依赖该响应头。
        add_header X-SAM3-Upstream $upstream_addr always;
    }
}
